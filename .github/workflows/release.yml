name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    name: Release gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: Frontend tests
        working-directory: desktop/frontend
        run: npm test

      - name: Install Playwright Chromium
        working-directory: desktop/frontend
        run: npx playwright install --with-deps chromium

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./...
        run: go test ./...

      - name: go test -race ./...
        run: go test -race ./...

      - name: Regression tests -- backup coverage trust behavior and rendered artifacts
        run: >
          go test ./cmd/scan ./internal/appcore ./internal/backup ./internal/restore ./internal/analyze ./internal/output
          -run "TestWritePersistsUnsupportedBackupCoverageArtifacts|TestApplyInspectionResultsPrefersVerifiedCoverageSource|TestApplyInspectionResultsSurfacesPermissionDeniedReason|TestSimulateLeavesCoverageUnknownWhenPoliciesAreUnverified|TestEvaluateBackupCoverageUnverified|TestBuildReportMarksDetectionOnlyBackupCoverageAsUnverified|TestSharedOutputCSSUsesSharedThemePalette|TestDryRunFinalizationMatchesSinglePass|TestExportBundleWritesOnlyRequestedArtifacts|TestExportBundleRequiresSelectedOutput"

      - name: Build Linux binary (GOOS=linux GOARCH=amd64)
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/scan-linux-amd64 ./cmd/scan

      - name: Build Windows binary (GOOS=windows GOARCH=amd64)
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/scan-windows-amd64.exe ./cmd/scan

      - name: Verify binary formats
        run: |
          file dist/scan-linux-amd64 | grep -q "ELF 64-bit" || { echo "ERROR: scan-linux-amd64 is not a Linux ELF binary"; exit 1; }
          file dist/scan-windows-amd64.exe | grep -q "PE32+" || { echo "ERROR: scan-windows-amd64.exe is not a Windows PE32+ binary"; exit 1; }

      - name: Smoke test -- dry-run
        run: |
          mkdir -p /tmp/smoke
          ./dist/scan-linux-amd64 --dry-run --summary --runbook --redact --csv --out /tmp/smoke --min-score 0

      - name: Smoke test -- verify JSON output
        run: |
          JSON=/tmp/smoke/recovery-scan.json
          grep -q '"schemaVersion"' "$JSON" || { echo "ERROR: missing schemaVersion in output JSON"; exit 1; }
          grep -q '"overall"' "$JSON" || { echo "ERROR: missing overall score in output JSON"; exit 1; }
          grep -q '"findings"' "$JSON" || { echo "ERROR: missing findings array in output JSON"; exit 1; }
          grep -q '"coverageStatus"' "$JSON" || { echo "ERROR: missing coverageStatus in output JSON"; exit 1; }

      - name: Smoke test -- validate emitted schemas
        run: |
          go run ./cmd/schema-validate -schema ./schemas/recovery-scan-3.0.0.schema.json -input /tmp/smoke/recovery-scan.json
          go run ./cmd/schema-validate -schema ./schemas/recovery-enriched-1.1.0.schema.json -input /tmp/smoke/recovery-enriched.json

      - name: Validate committed schema samples
        run: |
          go run ./cmd/schema-validate -schema ./schemas/recovery-scan-3.0.0.schema.json -input ./schemas/examples/recovery-scan-3.0.0.sample.json
          go run ./cmd/schema-validate -schema ./schemas/recovery-scan-3.0.0.schema.json -input ./schemas/examples/recovery-scan-3.0.0.unverified.sample.json
          go run ./cmd/schema-validate -schema ./schemas/recovery-enriched-1.1.0.schema.json -input ./schemas/examples/recovery-enriched-1.1.0.sample.json

      - name: Validate committed trust semantics example
        run: |
          JSON=./schemas/examples/recovery-scan-3.0.0.unverified.sample.json
          grep -q '"coverageStatus": "unsupported"' "$JSON" || { echo "ERROR: committed unverified example must show unsupported coverage"; exit 1; }
          grep -q '"conclusion": "unverified"' "$JSON" || { echo "ERROR: committed unverified example must show unverified assurance"; exit 1; }
          grep -q '"id": "BACKUP_COVERAGE_UNVERIFIED"' "$JSON" || { echo "ERROR: committed unverified example must include the backup trust finding"; exit 1; }

      - name: Smoke test -- evaluate CI gate engine
        run: go run ./cmd/check --current /tmp/smoke/recovery-scan.json --min-score 0 --format json

      - name: Smoke test -- verify report bundle and palette
        run: |
          HTML=/tmp/smoke/recovery-report.html
          test -f "$HTML" || { echo "ERROR: HTML report not generated"; exit 1; }
          for tab in Summary Nodes Workloads Storage Networking Config Images Backup "DR Score" Findings Remediation; do
            grep -q "$tab" "$HTML" || { echo "ERROR: tab '$tab' missing from HTML report"; exit 1; }
          done
          grep -q '#58a6ff' "$HTML" || { echo "ERROR: shared accent token missing from report"; exit 1; }
          grep -q '#f85149' "$HTML" || { echo "ERROR: shared critical token missing from report"; exit 1; }
          ! grep -q '#9a6bff' "$HTML" || { echo "ERROR: old report accent palette leaked into output"; exit 1; }

      - name: Generate deterministic GUI screenshots
        working-directory: desktop/frontend
        run: npm run screenshots

      - name: Validate docs links and screenshot references
        run: go run ./tools/docscheck

      - name: Build Wails desktop app
        working-directory: desktop
        run: wails build -clean -nopackage -skipbindings -s -platform linux/amd64 -o k8s-recovery-visualizer-desktop

      - name: Smoke test -- container build
        run: docker build -t k8vis-smoke .

  cli-assets:
    name: CLI assets
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          BUILD_DATE="$(date -u +%F)"
          LDFLAGS="-s -w -X 'k8s-recovery-visualizer/internal/model.Version=${VERSION#v}' -X 'k8s-recovery-visualizer/internal/model.BuildDate=${BUILD_DATE}'"
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o release/scan-linux-amd64 ./cmd/scan
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o release/scan-linux-arm64 ./cmd/scan
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o release/scan-darwin-amd64 ./cmd/scan
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o release/scan-darwin-arm64 ./cmd/scan
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o release/scan-windows-amd64.exe ./cmd/scan

      - uses: actions/upload-artifact@v4
        with:
          name: cli-assets
          path: release/*

  gui-linux:
    name: Desktop package (Linux)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build Linux desktop package
        env:
          VERSION: ${{ github.ref_name }}
        working-directory: desktop
        run: |
          BUILD_DATE="$(date -u +%F)"
          LDFLAGS="-s -w -X 'k8s-recovery-visualizer/internal/model.Version=${VERSION#v}' -X 'k8s-recovery-visualizer/internal/model.BuildDate=${BUILD_DATE}'"
          wails build -clean -skipbindings -s -platform linux/amd64 -o k8s-recovery-visualizer-desktop -ldflags "$LDFLAGS"

      - name: Archive Linux desktop output
        run: |
          mkdir -p release
          tar -czf release/k8s-recovery-visualizer-desktop-linux-amd64.tar.gz -C desktop/build/bin .

      - uses: actions/upload-artifact@v4
        with:
          name: gui-linux
          path: release/*

  gui-windows:
    name: Desktop package (Windows)
    runs-on: windows-latest
    needs: verify

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          "$((go env GOPATH))\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build Windows desktop package
        shell: pwsh
        working-directory: desktop
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          $ldflags = "-s -w -X 'k8s-recovery-visualizer/internal/model.Version=$($env:VERSION.TrimStart('v'))' -X 'k8s-recovery-visualizer/internal/model.BuildDate=$buildDate'"
          wails build -clean -skipbindings -s -nsis -platform windows/amd64 -o k8s-recovery-visualizer-desktop.exe -ldflags $ldflags

      - name: Archive Windows desktop output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path desktop\build\bin\* -DestinationPath release\k8s-recovery-visualizer-desktop-windows-amd64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: release/*

  gui-macos:
    name: Desktop package (macOS)
    runs-on: macos-latest
    needs: verify

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build macOS desktop package
        env:
          VERSION: ${{ github.ref_name }}
        working-directory: desktop
        run: |
          BUILD_DATE="$(date -u +%F)"
          LDFLAGS="-s -w -X 'k8s-recovery-visualizer/internal/model.Version=${VERSION#v}' -X 'k8s-recovery-visualizer/internal/model.BuildDate=${BUILD_DATE}'"
          wails build -clean -skipbindings -s -platform darwin/amd64 -o k8s-recovery-visualizer-desktop -ldflags "$LDFLAGS"

      - name: Archive macOS desktop output
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent desktop/build/bin/k8s-recovery-visualizer-desktop.app release/k8s-recovery-visualizer-desktop-darwin-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gui-macos
          path: release/*

  publish-container:
    name: Publish container image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v6

      - name: Compute build metadata
        id: buildmeta
        run: |
          echo "build_date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/k8s-recovery-visualizer
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            BUILD_DATE=${{ steps.buildmeta.outputs.build_date }}
          provenance: mode=max
          sbom: true

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - cli-assets
      - gui-linux
      - gui-windows
      - gui-macos
      - publish-container

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release
          merge-multiple: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate checksums
        run: |
          find release -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > release/checksums.txt

      - name: Generate SBOM
        run: syft dir:release -o spdx-json=release/k8s-recovery-visualizer.spdx.json

      - name: Create release notes from CHANGELOG
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)", re.M | re.S)
          match = pattern.search(changelog)
          notes = match.group(0).strip() if match else f"## [{version}]\n\nRelease notes unavailable."
          footer = """

## Release Assets

- CLI binaries for Linux, macOS, and Windows
- Desktop packages for Linux, macOS, and Windows
- `checksums.txt`
- `k8s-recovery-visualizer.spdx.json`
"""
          pathlib.Path("release-notes.md").write_text(notes + footer + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t ASSETS < <(find release -maxdepth 1 -type f | sort)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ASSETS[@]}" \
              --verify-tag \
              --notes-file release-notes.md \
              --title "${GITHUB_REF_NAME}"
          fi
