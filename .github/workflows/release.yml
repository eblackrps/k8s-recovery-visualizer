name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  verify:
    name: Release gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev
          mkdir -p "$RUNNER_TEMP/pkgconfig"
          ln -sf "$(dpkg -L libwebkit2gtk-4.1-dev | grep '/webkit2gtk-4.1.pc$' | head -n 1)" "$RUNNER_TEMP/pkgconfig/webkit2gtk-4.0.pc"
          ln -sf "$(dpkg -L libjavascriptcoregtk-4.1-dev | grep '/javascriptcoregtk-4.1.pc$' | head -n 1)" "$RUNNER_TEMP/pkgconfig/javascriptcoregtk-4.0.pc"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: Frontend tests
        working-directory: desktop/frontend
        run: npm test

      - name: Install Playwright Chromium
        working-directory: desktop/frontend
        run: npx playwright install --with-deps chromium

      - name: go build ./...
        run: go build ./...

      - name: go vet ./...
        run: go vet ./...

      - name: go test ./...
        run: go test ./...

      - name: go test -race ./...
        run: go test -race ./...

      - name: Regression tests -- backup coverage trust behavior and rendered artifacts
        run: >
          go test ./cmd/scan ./internal/appcore ./internal/backup ./internal/restore ./internal/analyze ./internal/output
          -run "TestWritePersistsUnsupportedBackupCoverageArtifacts|TestApplyInspectionResultsPrefersVerifiedCoverageSource|TestApplyInspectionResultsSurfacesPermissionDeniedReason|TestSimulateLeavesCoverageUnknownWhenPoliciesAreUnverified|TestEvaluateBackupCoverageUnverified|TestBuildReportMarksDetectionOnlyBackupCoverageAsUnverified|TestBuildReportRendersRestoreDrillAndFindingPrioritization|TestBuildRunbookRendersRestoreDrillAndPrioritizedFindings|TestSharedOutputCSSUsesSharedThemePalette|TestDryRunFinalizationMatchesSinglePass|TestExportBundleWritesOnlyRequestedArtifacts|TestExportBundleRequiresSelectedOutput"

      - name: Build CLI smoke binary (linux amd64)
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/cli-smoke-linux-amd64 ./cmd/scan

      - name: Build CLI source validation binary (windows amd64)
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/cli-source-windows-amd64.exe ./cmd/scan

      - name: Verify CLI binary formats
        run: |
          file dist/cli-smoke-linux-amd64 | grep -q "ELF 64-bit" || { echo "ERROR: cli-smoke-linux-amd64 is not a Linux ELF binary"; exit 1; }
          file dist/cli-source-windows-amd64.exe | grep -q "PE32+" || { echo "ERROR: cli-source-windows-amd64.exe is not a Windows PE32+ binary"; exit 1; }

      - name: Smoke test -- dry-run
        run: |
          mkdir -p /tmp/smoke
          ./dist/cli-smoke-linux-amd64 --dry-run --summary --runbook --redact --csv --out /tmp/smoke --min-score 0

      - name: Smoke test -- verify JSON output
        run: |
          JSON=/tmp/smoke/recovery-scan.json
          grep -q '"schemaVersion"' "$JSON" || { echo "ERROR: missing schemaVersion in output JSON"; exit 1; }
          grep -q '"overall"' "$JSON" || { echo "ERROR: missing overall score in output JSON"; exit 1; }
          grep -q '"findings"' "$JSON" || { echo "ERROR: missing findings array in output JSON"; exit 1; }
          grep -q '"coverageStatus"' "$JSON" || { echo "ERROR: missing coverageStatus in output JSON"; exit 1; }

      - name: Smoke test -- validate emitted schemas
        run: |
          go run ./cmd/schema-validate -schema ./schemas/recovery-scan-3.1.0.schema.json -input /tmp/smoke/recovery-scan.json
          go run ./cmd/schema-validate -schema ./schemas/recovery-enriched-1.2.0.schema.json -input /tmp/smoke/recovery-enriched.json

      - name: Validate committed schema samples
        run: |
          go run ./cmd/schema-validate -schema ./schemas/recovery-scan-3.1.0.schema.json -input ./schemas/examples/recovery-scan-3.1.0.sample.json
          go run ./cmd/schema-validate -schema ./schemas/recovery-scan-3.1.0.schema.json -input ./schemas/examples/recovery-scan-3.1.0.unverified.sample.json
          go run ./cmd/schema-validate -schema ./schemas/recovery-enriched-1.2.0.schema.json -input ./schemas/examples/recovery-enriched-1.2.0.sample.json

      - name: Validate committed trust semantics example
        run: |
          JSON=./schemas/examples/recovery-scan-3.1.0.unverified.sample.json
          grep -q '"coverageStatus": "unsupported"' "$JSON" || { echo "ERROR: committed unverified example must show unsupported coverage"; exit 1; }
          grep -q '"conclusion": "unverified"' "$JSON" || { echo "ERROR: committed unverified example must show unverified assurance"; exit 1; }
          grep -q '"id": "BACKUP_COVERAGE_UNVERIFIED"' "$JSON" || { echo "ERROR: committed unverified example must include the backup trust finding"; exit 1; }

      - name: Smoke test -- evaluate CI gate engine
        run: go run ./cmd/check --current /tmp/smoke/recovery-scan.json --min-score 0 --format json

      - name: Smoke test -- verify report bundle and palette
        run: |
          HTML=/tmp/smoke/recovery-report.html
          test -f "$HTML" || { echo "ERROR: HTML report not generated"; exit 1; }
          for tab in Summary Nodes Workloads Storage Networking Config Images Backup "DR Score" Findings Remediation; do
            grep -q "$tab" "$HTML" || { echo "ERROR: tab '$tab' missing from HTML report"; exit 1; }
          done
          grep -q '#58a6ff' "$HTML" || { echo "ERROR: shared accent token missing from report"; exit 1; }
          grep -q '#f85149' "$HTML" || { echo "ERROR: shared critical token missing from report"; exit 1; }
          ! grep -q '#9a6bff' "$HTML" || { echo "ERROR: old report accent palette leaked into output"; exit 1; }

      - name: Generate deterministic GUI screenshots
        working-directory: desktop/frontend
        run: npm run screenshots

      - name: Validate docs links and screenshot references
        run: go run ./tools/docscheck

      - name: Build Wails desktop app
        working-directory: desktop
        run: wails build -clean -nopackage -skipbindings -s -platform linux/amd64 -o K8V

  desktop-package-linux:
    name: Desktop package (Linux amd64)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev
          mkdir -p "$RUNNER_TEMP/pkgconfig"
          ln -sf "$(dpkg -L libwebkit2gtk-4.1-dev | grep '/webkit2gtk-4.1.pc$' | head -n 1)" "$RUNNER_TEMP/pkgconfig/webkit2gtk-4.0.pc"
          ln -sf "$(dpkg -L libjavascriptcoregtk-4.1-dev | grep '/javascriptcoregtk-4.1.pc$' | head -n 1)" "$RUNNER_TEMP/pkgconfig/javascriptcoregtk-4.0.pc"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: Build Linux desktop package
        env:
          VERSION: ${{ github.ref_name }}
        working-directory: desktop
        run: |
          BUILD_DATE="$(date -u +%F)"
          LDFLAGS="-s -w -X 'k8s-recovery-visualizer/internal/model.Version=${VERSION#v}' -X 'k8s-recovery-visualizer/internal/model.BuildDate=${BUILD_DATE}'"
          wails build -clean -skipbindings -s -platform linux/amd64 -o K8V -ldflags "$LDFLAGS"

      - name: Archive Linux desktop output
        run: |
          mkdir -p release
          tar -czf release/k8s-recovery-visualizer-desktop-linux-amd64.tar.gz -C desktop/build/bin .
          test -f release/k8s-recovery-visualizer-desktop-linux-amd64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-release
          path: release/k8s-recovery-visualizer-desktop-linux-amd64.tar.gz

  desktop-package-windows:
    name: Desktop package (Windows amd64)
    runs-on: windows-latest
    needs: verify

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          "$((go env GOPATH))\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build

      - name: Build Windows desktop package
        shell: pwsh
        working-directory: desktop
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $buildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          $ldflags = "-s -w -X 'k8s-recovery-visualizer/internal/model.Version=$($env:VERSION.TrimStart('v'))' -X 'k8s-recovery-visualizer/internal/model.BuildDate=$buildDate'"
          wails build -clean -skipbindings -s -nsis -platform windows/amd64 -o K8V.exe -ldflags $ldflags -tags native_webview2loader

      - name: Archive Windows desktop output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path desktop\build\bin\* -DestinationPath release\k8s-recovery-visualizer-desktop-windows-amd64.zip -Force
          if (-not (Test-Path release\k8s-recovery-visualizer-desktop-windows-amd64.zip)) {
            throw "Windows desktop package archive was not created."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-release
          path: release/k8s-recovery-visualizer-desktop-windows-amd64.zip

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - desktop-package-linux
      - desktop-package-windows

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-release
          path: release

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: syft dir:release -o spdx-json=release/k8s-recovery-visualizer.spdx.json

      - name: Generate checksums
        run: |
          find release -maxdepth 1 -type f ! -name 'checksums.txt' -print0 | sort -z | xargs -0 sha256sum > release/checksums.txt

      - name: Validate release asset set
        run: |
          expected=(
            checksums.txt
            k8s-recovery-visualizer-desktop-linux-amd64.tar.gz
            k8s-recovery-visualizer-desktop-windows-amd64.zip
            k8s-recovery-visualizer.spdx.json
          )
          mapfile -t actual < <(find release -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${#actual[@]}" -ne "${#expected_sorted[@]}" ]; then
            printf 'ERROR: expected %d release files, found %d\n' "${#expected_sorted[@]}" "${#actual[@]}"
            printf 'Actual files:\n'
            printf '  %s\n' "${actual[@]}"
            exit 1
          fi
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Create release notes from CHANGELOG
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)", re.M | re.S)
          match = pattern.search(changelog)
          notes = match.group(0).strip() if match else f"## [{version}]\n\nRelease notes unavailable."
          footer = (
              "\n\n## Release Assets\n\n"
              "- `k8s-recovery-visualizer-desktop-linux-amd64.tar.gz`\n"
              "- `k8s-recovery-visualizer-desktop-windows-amd64.zip`\n"
              "- `checksums.txt`\n"
              "- `k8s-recovery-visualizer.spdx.json`\n"
          )
          pathlib.Path("release-notes.md").write_text(notes + footer + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected=(
            checksums.txt
            k8s-recovery-visualizer-desktop-linux-amd64.tar.gz
            k8s-recovery-visualizer-desktop-windows-amd64.zip
            k8s-recovery-visualizer.spdx.json
          )
          mapfile -t ASSETS < <(find release -maxdepth 1 -type f | sort)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              keep=false
              for expected_name in "${expected[@]}"; do
                if [ "$asset" = "$expected_name" ]; then
                  keep=true
                  break
                fi
              done
              if [ "$keep" = false ]; then
                gh release delete-asset "${GITHUB_REF_NAME}" "$asset" -y
              fi
            done < <(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ASSETS[@]}" \
              --verify-tag \
              --notes-file release-notes.md \
              --title "${GITHUB_REF_NAME}"
          fi
