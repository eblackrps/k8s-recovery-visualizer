apiVersion: v1
kind: Namespace
metadata:
  name: demo-store
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: demo-store
data:
  APP_NAME: demo-store
  FEATURE_COMPARE: "true"
  FEATURE_EXPORTS: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: demo-store
type: Opaque
stringData:
  username: demo
  password: change-me
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo-store
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: frontend-config
            - secretRef:
                name: db-credentials
          command:
            - /bin/sh
            - -c
            - |
              cat <<'EOF' >/usr/share/nginx/html/index.html
              <html>
              <body>
                <h1>demo-store</h1>
                <p>k8v local test cluster</p>
              </body>
              </html>
              EOF
              sed -i 's/listen       80;/listen       8080;/' /etc/nginx/conf.d/default.conf
              exec nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: demo-store
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: demo-store
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-cache-audit
  namespace: demo-store
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: audit
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - echo "nightly cache audit"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: demo-store
spec:
  rules:
    - host: demo-store.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
